[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-data-lakehouse"
version = "0.1.0"
description = "Market data lakehouse on Cloudflare R2 — stocks, ETFs, options, and AI-native query interface"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=1.5.0,<2.0.0",
    "pandas-ta>=0.3.14b",
    "py_vollib>=1.0.1",
    "pyiceberg[s3fs]>=0.6.0",
    "duckdb>=0.10.0",
    "boto3>=1.34.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.0.0",
    "alpaca-py>=0.20.0",
    "tabulate>=0.9.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
]
